[/Script/Engine.PhysicsSettings]
; Source sv_gravity 600 u/s^2 x 1.905 cm/u. The character also rescales itself from the LambdaSource settings.
DefaultGravityZ=-1143.000000

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; The rtx path: Lumen GI and reflections over hardware ray tracing. These are the defaults; module startup
; drops to the legacy set (no GI, screen-space reflections) on -nortx or on a card that cannot trace, and the
; rtx console command moves between the two at runtime.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Compiled in and toggleable at runtime (ERayTracingMode::Dynamic). On hardware without ray tracing the RHI
; refuses it by itself and the legacy path is all there is.
r.RayTracing=True
r.RayTracing.EnableOnDemand=1
; Shade ray hits directly rather than from the surface cache, which has no cards to be built from here.
r.Lumen.HardwareRayTracing.LightingMode=1
; Ray tracing refuses to start without the skin cache - a Fatal at boot, not a warning.
r.SkinCache.CompileShaders=True
; Deliberately off, and not an optimisation: distance fields can only be generated in the editor, and every
; mesh here is built at runtime from a BSP. Software Lumen can never see this world; hardware is the only path.
r.GenerateMeshDistanceFields=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False

