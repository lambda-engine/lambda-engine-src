[/Script/NavigationSystem.NavigationSystemV1]
; The world is a BSP built after the level has loaded, so there is nothing to generate navigation from until
; then: it is generated at runtime, once, when the map finishes loading.
bAutoCreateNavigationData=True
bAllowClientSideNavigation=True
bInitialBuildingLocked=False
bGenerateNavigationOnlyAroundNavigationInvokers=True

[/Script/NavigationSystem.RecastNavMesh]
; Dynamic: the navmesh may be built while the game is running, which is the only time we have any geometry.
RuntimeGeneration=Dynamic
; Sized for the smallest thing that walks: HULL_TINY, the headcrab, is 12 units across and 24 tall. In
; centimetres at 1.905 per unit that is a 23cm radius and a 46cm height.
AgentRadius=23.0
AgentHeight=46.0
AgentMaxSlope=45.0
; A headcrab steps over what the player can: 18 units.
AgentMaxStepHeight=34.0
CellSize=12.0
CellHeight=6.0
TileSizeUV=64
; The pool is how many tiles may exist at once. It is worked out from the navmesh's bounds, and ours has none
; worth speaking of when the world is initialised - the map arrives later - so it comes out at three, and the
; fourth tile the generator tries to add is refused. Sized by hand instead: enough for a large map.
bFixedTilePoolSize=True
TilePoolSize=4096
